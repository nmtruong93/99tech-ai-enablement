[project]
name = "support-desk"
version = "0.1.0"
description = "MCP server that triages the support queue and drafts policy-checked replies for human review"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.10",
]

[project.scripts]
support-desk = "support_desk.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]
